[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppl-lang"
version = "0.10.0"
description = "PPL - Prompt Programming Language reference interpreter"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ppl = "ppl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
